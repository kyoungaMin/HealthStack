services:
  - type: web
    name: healthstack-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KOREA_DRUG_API_KEY
        sync: false
      - key: NAVER_OCR_API_URL
        sync: false
      - key: NAVER_OCR_SECRET_KEY
        sync: false
      - key: NAVER_SEARCH_CLIENT_ID
        sync: false
      - key: NAVER_SEARCH_CLIENT_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PUBMED_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /
